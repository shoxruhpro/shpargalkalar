<!-- ul — belgili (tartiblanmagan) ro'yxat -->
<ul>
  <li>Ro'yxat elementi</li>
  <li>Yana bittasi</li>
</ul>

<!-- ol — raqamli (tartiblangan). start raqamlash boshlanishini to'g'irlaydi -->
<ol start="3">
  <li>Birinchi qadam</li>
  <li>Ikkinchi qadam</li>
</ol>

<!-- Ro'yxatlarni bir-birining ichiga joylashtirish mumkin -->
<ul>
  <li>
    Bo'lim
    <ul>
      <li>Ichki bo'lim</li>
    </ul>
  </li>
</ul>

<!-- dl — tavsiflovchi ro'yxat: dt (so'z) + dd (ta'rif) -->
<dl>
  <dt>HTML</dt>
  <dd>Web-sahifalarni belgilash tili.</dd>
  <dt>CSS</dt>
  <dd>Sahifalarni shakllantirish tili.</dd>
</dl>
