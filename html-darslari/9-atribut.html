<!-- id — takrorlanmas identifikator (sahifada bitta bo'lishi kerak) -->
<div id="main-block">...</div>

<!-- class — stillar va skriptlar uchun ism(nom), bir nechta ishlatsa bo'ladi -->
<p class="text big highlighted">Matn</p>

<!-- data-* — JavaScript uchun alohida ma'lumotlar -->
<button data-id="42" data-action="buy">Sotib olish</button>

<!-- style — biriktirilgan stillar (yaxshisi CSS ajratgan ma'qul) -->
<p style="color: red; font-size: 18px">Qizil matn</p>

<!-- title — kursor borganda qalqib chiquvchi tavsif -->
<abbr title="HyperText Markup Language">HTML</abbr>

<!-- Mantiqiy atributlar qiymat talab qilmaydi -->
<input disabled /> <input checked type="checkbox" />
