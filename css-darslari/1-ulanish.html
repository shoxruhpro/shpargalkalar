<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sintaksis va ulanish</title>
    <!-- Tashqi fayldan (tavsiya etiladi): -->
    <link rel="stylesheet" href="style.css" />
    <!-- HTMLda <head> ichidagi <style> tegi: -->
    <style>
      /* Bu komment. Bittaligi // CSS da yo'q — faqat shunaqasi bor. */

      /* Qoida tuzilishi: tanlovchi { xossa: qiymat; xossa: qiymat; } */

      h1 {
        color: red; /* color xossa, red qiymat */
        font-size: 32px; /* har bir xossa-qiymat ; bilan tugaydi */
      }

      /* Bir nechta tanlovchilarni vergul bilan ajratib umumiy stillar berish mumkin: */
      h1,
      h2,
      h3 {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Inlayn-atribut: -->
    <p style="color: blue">— ishlatishdan qoching.</p>

    <h1>Lorem.</h1>
    <h2>Lorem, ipsum.</h2>
    <h3>Lorem, ipsum dolor.</h3>
  </body>
</html>
